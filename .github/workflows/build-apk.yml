name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build www directory
        run: node build-android.js

      - name: Debug info
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "Java: $(java -version 2>&1 || echo 'not found')"
          ls -la www/ 2>/dev/null || echo "www/ not found"
          npx cap --version

      - name: Add Android platform
        run: npx --yes @capacitor/cli add android --verbose

      - name: Sync to Android
        run: npx --yes @capacitor/cli copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doomday-rv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
